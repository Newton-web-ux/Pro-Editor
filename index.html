<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pro Mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8fc;--surface:#fff;--surface2:#eaf1fb;--text:#1f2328;--muted:#5f6b7a;--line:#e3e8ef;--accent:#0b57d0;--accent-bg:#d3e3fd;--accent-ink:#fff;--danger:#c5221f;--read:#f2f6fc;--shadow:0 1px 3px rgba(16,24,40,.12),0 8px 24px rgba(16,24,40,.12);--radius:14px;--row-h:44px}
[data-theme=dark]{--bg:#0f1318;--surface:#171c23;--surface2:#222a35;--text:#e7eaee;--muted:#98a2b0;--line:#2a323d;--accent:#8ab4f8;--accent-bg:#27405f;--accent-ink:#0b1320;--danger:#f28b82;--read:#12171d;--shadow:0 1px 3px rgba(0,0,0,.5),0 8px 28px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'DM Sans',system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
body.compact{--row-h:34px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.ic{display:block;flex:none}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:background .15s}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.icon-btn.sm{width:30px;height:30px}
.icon-btn.on{color:#e8a200}
.btn{height:38px;padding:0 18px;border-radius:19px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}
.linkbtn{color:var(--muted);font-size:13px;padding:2px 6px;border-radius:6px}
.linkbtn:hover{background:var(--surface2);color:var(--text)}
.brand{font-family:Syne,sans-serif;font-weight:800;letter-spacing:-.02em}
.mono{font-family:'DM Mono',monospace}

/* auth */
.auth{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 20% -10%,var(--accent-bg),transparent),var(--bg)}
.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:34px 32px;box-shadow:var(--shadow)}
.auth-card .brand{font-size:28px;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#7a5af8);display:grid;place-items:center;color:#fff}
.auth-card p.sub{margin:0 0 22px;color:var(--muted)}
.tabs{display:flex;background:var(--surface2);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;height:34px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.fld input,.fld textarea,.fld select{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);outline:none}
.fld textarea{height:100px;padding:10px 12px;resize:vertical}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.suffix{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.suffix:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.suffix input{border:0!important;box-shadow:none!important;flex:1;min-width:0}
.suffix em{font-style:normal;color:var(--muted);padding-right:12px;font-size:13px}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:2px 0 10px}
.auth-card .btn.primary{width:100%;height:44px;border-radius:12px}
.banner{background:#fff4d6;color:#6b4e00;border:1px solid #f2d98b;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}

/* shell */
#app{height:100%;display:flex;flex-direction:column}
.topbar{height:64px;display:flex;align-items:center;gap:8px;padding:0 14px 0 10px;flex:none}
.top-brand{display:flex;align-items:center;gap:10px;width:236px;font-size:21px}
.search{flex:1;max-width:720px;height:46px;border-radius:24px;background:var(--surface2);display:flex;align-items:center;padding:0 6px 0 14px;gap:8px;color:var(--muted);transition:background .15s,box-shadow .15s}
.search:focus-within{background:var(--surface);box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:none;outline:none;height:100%;color:var(--text)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:2px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none;text-transform:uppercase}
.layout{flex:1;display:flex;min-height:0}
#sidebar{width:256px;flex:none;padding:6px 12px 12px 8px;overflow:auto;transition:margin .2s}
body.sb-collapsed #sidebar{margin-left:-256px}
.compose-btn{height:54px;padding:0 24px 0 16px;border-radius:16px;background:var(--accent-bg);color:var(--text);font-weight:600;display:flex;align-items:center;gap:12px;margin:6px 0 16px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.compose-btn:hover{box-shadow:var(--shadow)}
.nav{display:flex;align-items:center;gap:14px;width:100%;height:34px;padding:0 14px 0 20px;border-radius:0 17px 17px 0;color:var(--text);text-align:left;margin-left:-8px;padding-left:28px}
.nav:hover{background:var(--surface2)}
.nav.on{background:var(--accent-bg);font-weight:700}
.nav .n{margin-left:auto;font-size:12px;font-weight:700}
.nav .dot{width:12px;height:12px;border-radius:50%;flex:none;margin:0 3px}
.side-h{display:flex;align-items:center;justify-content:space-between;margin:18px 0 4px 20px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.nav .x{opacity:0;margin-left:auto;color:var(--muted)}
.nav:hover .x{opacity:1}
.nav:hover .x+.n{display:none}
#main{flex:1;min-width:0;margin:0 14px 14px 0;background:var(--surface);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.toolbar{height:48px;display:flex;align-items:center;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);flex:none}
.toolbar .sp{flex:1}
.toolbar .info{color:var(--muted);font-size:12px;padding:0 8px}
.chk{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.list-scroll{flex:1;overflow:auto}
.row{display:flex;align-items:center;gap:10px;height:var(--row-h);padding:0 14px 0 12px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--read);position:relative}
.row.unread{background:var(--surface);font-weight:700}
.row:hover{box-shadow:inset 1px 0 0 var(--accent-bg),0 1px 3px rgba(16,24,40,.14);z-index:1}
.row.sel{background:var(--accent-bg)}
.row.cur{outline:2px solid var(--accent);outline-offset:-2px}
.row .who{width:200px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .cnt{font-weight:500;color:var(--muted);font-size:12px;margin-left:4px}
.row .mid{flex:1;min-width:0;display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden}
.row .subj{flex:none;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.row .snip{color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis}
.row .when{flex:none;font-size:12px;color:var(--muted);min-width:56px;text-align:right}
.row.unread .when{color:var(--text)}
.star{color:var(--muted);width:30px;height:30px;display:grid;place-items:center;border-radius:50%;flex:none}
.star:hover{background:var(--surface2)}
.star.on{color:#e8a200}
.star.on svg{fill:#e8a200}
.draft-tag{color:var(--danger)}
.lbl{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600;color:#fff;flex:none}
.clip{color:var(--muted);flex:none}
.empty{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:40px}
.empty .big{width:72px;height:72px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;margin:0 auto 14px}
.list-foot{padding:14px;text-align:center;color:var(--muted)}

/* reader */
.reader{flex:1;overflow:auto;padding:18px 28px 40px}
.r-subject{font-size:22px;font-weight:500;margin:6px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.msg{border:1px solid var(--line);border-radius:12px;margin:12px 0;background:var(--surface)}
.msg-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.msg-head .meta{flex:1;min-width:0}
.msg-head .nm{font-weight:700}
.msg-head .ad{color:var(--muted);font-size:12px;margin-left:6px}
.msg-head .to{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-head .tm{color:var(--muted);font-size:12px;flex:none}
.msg:not(.open) .msg-body,.msg:not(.open) .msg-atts,.msg:not(.open) .msg-act{display:none}
.msg:not(.open) .to{display:none}
.msg:not(.open) .snip-line{display:block}
.snip-line{display:none;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-body{padding:4px 16px 16px 62px;line-height:1.6;overflow-wrap:anywhere}
.msg-body a,.editor a{color:var(--accent)}
.msg-body blockquote,.editor blockquote{margin:8px 0;padding-left:12px;border-left:3px solid var(--line);color:var(--muted)}
.msg-body pre{background:var(--surface2);padding:10px;border-radius:8px;overflow:auto}
.msg-body table{border-collapse:collapse}
.msg-body td,.msg-body th{border:1px solid var(--line);padding:4px 8px}
.msg-atts{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 14px 62px}
.att{display:inline-flex;align-items:center;gap:8px;max-width:260px;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);text-decoration:none;font-size:13px}
.att:hover{background:var(--surface2)}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att small{color:var(--muted);flex:none}
.msg-act{display:flex;gap:8px;padding:0 16px 16px 62px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.tag.bad{background:#fde7e7;color:var(--danger)}

/* compose */
#composeDock{position:fixed;right:20px;bottom:0;display:flex;flex-direction:row-reverse;align-items:flex-end;gap:14px;z-index:30;pointer-events:none}
.compose{pointer-events:auto;width:540px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:calc(100vh - 90px);height:560px}
.compose.min{height:auto}
.compose.min .c-main{display:none}
.compose.max{position:fixed;inset:6vh 8vw;width:auto;max-width:none;height:auto;max-height:none;border-radius:14px;border-bottom:1px solid var(--line);z-index:60}
.c-head{display:flex;align-items:center;gap:2px;padding:6px 8px 6px 16px;background:var(--surface2);border-radius:14px 14px 0 0;cursor:pointer;font-weight:600}
.c-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-main{display:flex;flex-direction:column;flex:1;min-height:0}
.c-row{display:flex;align-items:flex-start;gap:8px;padding:5px 14px;border-bottom:1px solid var(--line)}
.c-row>label{color:var(--muted);width:34px;padding-top:6px;flex:none}
.field{flex:1;display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:0}
.field input{flex:1;min-width:120px;border:0;outline:none;background:none;height:30px}
.field input.bad{color:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 4px 0 10px;border-radius:13px;background:var(--surface2);font-size:13px}
.chip button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.chip button:hover{background:var(--line)}
.c-subject{border:0;border-bottom:1px solid var(--line);padding:10px 14px;outline:none;background:none}
.fmt{display:flex;gap:2px;padding:4px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fmt button{min-width:30px;height:28px;border-radius:6px;color:var(--muted);font-weight:700;display:grid;place-items:center;padding:0 6px}
.fmt button:hover{background:var(--surface2);color:var(--text)}
.editor{flex:1;overflow:auto;padding:12px 16px;outline:none;line-height:1.55;min-height:120px}
.c-atts{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 8px}
.c-atts:empty{display:none}
.c-atts .att button{color:var(--muted);margin-left:2px}
.c-foot{display:flex;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.c-foot .grow{flex:1;color:var(--muted);font-size:12px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* overlays */
#overlay .wrap{position:fixed;inset:0;background:rgba(10,14,20,.45);display:grid;place-items:center;z-index:80;padding:16px}
.modal{width:min(440px,100%);background:var(--surface);border-radius:18px;padding:24px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal h2{margin:0 0 14px;font-size:18px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.modal p{color:var(--muted);margin:0}
.popover{position:fixed;z-index:90;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px}
.popover button{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 12px;border-radius:8px;text-align:left}
.popover button:hover{background:var(--surface2)}
.popover .sep{height:1px;background:var(--line);margin:6px 0}
.popover .hd{padding:8px 12px;color:var(--muted);font-size:12px}
#toasts{position:fixed;left:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{display:flex;align-items:center;gap:16px;background:#202124;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);max-width:420px;animation:in .2s ease}
.toast.error{background:#8c1d18}
.toast button{color:#8ab4f8;font-weight:700}
@keyframes in{from{transform:translateY(8px);opacity:0}}

@media(max-width:860px){
 .top-brand span{display:none}.top-brand{width:auto}
 #sidebar{position:fixed;z-index:40;top:64px;bottom:0;left:0;background:var(--bg);margin-left:-260px;box-shadow:var(--shadow);width:256px}
 body.sb-open #sidebar{margin-left:0}
 body.sb-collapsed #sidebar{margin-left:-260px}
 #main{margin:0 8px 8px}
 .row .who{width:110px}
 .row .snip{display:none}
 .reader{padding:14px}.msg-body,.msg-atts,.msg-act{padding-left:16px}
 .compose.max{inset:0;border-radius:0}
}
</style>
</head>
<body>

<div id="auth" class="auth" hidden>
  <div class="auth-card">
    <div class="brand"><div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div>Pro Mail</div>
    <p class="sub">Fast, private, professional email.</p>
    <div id="cfgWarn" class="banner" hidden>Firebase is not configured yet. Add your project settings to <b>FIREBASE_CONFIG</b> in this file.</div>
    <div class="tabs"><button type="button" id="tabIn" class="on">Sign in</button><button type="button" id="tabUp">Create account</button></div>
    <form id="authForm" autocomplete="on">
      <label class="fld" id="nameFld" hidden><span>Full name</span><input id="aName" maxlength="60" autocomplete="name"></label>
      <label class="fld"><span>Username</span><div class="suffix"><input id="aUser" autocomplete="username" spellcheck="false" autocapitalize="none"><em id="aDomain"></em></div></label>
      <label class="fld"><span>Password</span><input id="aPass" type="password" autocomplete="current-password"></label>
      <div class="err" id="authErr"></div>
      <button class="btn primary" id="authBtn" type="submit">Sign in</button>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <button class="icon-btn" data-act="menu" title="Main menu" id="menuBtn"></button>
    <div class="top-brand brand"><div class="logo" style="width:32px;height:32px"></div><span>Pro Mail</span></div>
    <div class="search"><span id="searchIc"></span><input id="search" placeholder="Search mail  (from: to: subject: is:unread has:attachment label:)" autocomplete="off" spellcheck="false"><button class="icon-btn sm" data-act="clearsearch" id="clearSearch" hidden title="Clear search"></button></div>
    <div class="top-actions">
      <button class="icon-btn" data-act="theme" title="Toggle theme" id="themeBtn"></button>
      <button class="icon-btn" data-act="settings" title="Settings" id="setBtn"></button>
      <button class="icon-btn" data-act="usermenu" title="Account" id="userBtn" style="width:44px"></button>
    </div>
  </header>
  <div class="layout">
    <aside id="sidebar"></aside>
    <main id="main"></main>
  </div>
  <div id="composeDock"></div>
</div>
<div id="overlay"></div>
<div id="toasts"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, deleteUser, updateProfile } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, query, orderBy, limit, onSnapshot, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ============================ CONFIG ============================ */
const firebaseConfig = {
  apiKey: "AIzaSyAxV-h9ugxGq9LyQmg6nUutqOjDFP_bGmk",
  authDomain: "pro-mail-2941d.firebaseapp.com",
  projectId: "pro-mail-2941d",
  storageBucket: "pro-mail-2941d.firebasestorage.app",
  messagingSenderId: "265443724637",
  appId: "1:265443724637:web:7e9c3da27315128edbacb4"
};
const GAS_URL = "https://script.google.com/macros/s/AKfycbxv4Vg23Q-HzMg_SNPgg8PKK1Z1YWv5Au3ZyxHMdV7OU1dUeBkOKu_3xI-HxGiTZC4/exec";   // Apps Script /exec URL (attachments + external email)
const MAIL_DOMAIN = "promail.app";                 // must match firestore.rules and Code.gs
const MAX_ATTACH = 10 * 1024 * 1024;
const MAX_RECIPIENTS = 25;
const PAGE = 200;
/* ================================================================ */

const CFG_OK = !String(FIREBASE_CONFIG.apiKey).startsWith("YOUR_");
const GAS_ON = /^https:\/\/script\.google\.com\//.test(GAS_URL);
let app, auth, db;
if (CFG_OK) { app = initializeApp(FIREBASE_CONFIG); auth = getAuth(app); db = getFirestore(app); }

/* ----------------------------- helpers ----------------------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const EMAIL_RE = /^[^\s@<>,;]+@[^\s@<>,;]+\.[^\s@<>,;]+$/;
const USER_RE = /^[a-z0-9][a-z0-9._]{2,29}$/;
const PALETTE = ['#d93025', '#e8710a', '#188038', '#1a73e8', '#7b3fe4', '#c2185b', '#00897b', '#5f6368', '#a15c00', '#0b8043'];
const colorOf = s => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
const uniq = a => [...new Set(a)];
const isInternal = a => a.endsWith('@' + MAIL_DOMAIN);

const ICONS = {
  menu: '<line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>',

    case 'starred': return m.starred && f !== 'trash' && f !== 'spam';
    case 'sent': return f === 'sent';
    case 'drafts': return f === 'drafts';
    case 'spam': return f === 'spam';
    case 'trash': return f === 'trash';
    case 'all': return f !== 'trash' && f !== 'spam';

  }
}

    const m = /^(from|to|subject|label|is|has|in):(.+)$/i.exec(tok);

}

  const to = [...m.to, ...m.cc].join(' ').toLowerCase();
  if (!f.from.every(v => from.includes(v))) return false;
  if (!f.to.every(v => to.includes(v))) return false;
  if (!f.subject.every(v => (m.subject || '').toLowerCase().includes(v))) return false;
  for (const v of f.label) { const l = (state.profile.labels || []).find(x => x.name.toLowerCase() === v); if (!l || !m.labels.includes(l.id)) return false; }
  for (const v of f.is) { if (v === 'unread' && m.read) return false; if (v === 'read' && !m.read) return false; if (v === 'starred' && !m.starred) return false; }
  if (f.has.includes('attachment') && !m.attachments.length) return false;
  const hay = (m.subject + ' ' + m.snippet + ' ' + from + ' ' + to).toLowerCase();
  return f.text.every(v => hay.includes(v));
}

  const uid = me(), all = [...items.map(i => ({ ...i, op: 'u' })), ...dels.map(id => ({ id, op: 'd' }))];
  for (let i = 0; i < all.length; i += 400) {
    const b = writeBatch(db);
    all.slice(i, i + 400).forEach(it => { const r = doc(db, 'users', uid, 'mails', it.id); it.op === 'u' ? b.update(r, it.patch) : b.delete(r); });
    await b.commit();

}
async function moveAction(kind) {
  const keys = targetKeys(); if (!keys.size) return;
  const uid = me(), list = mailsOfKeys(keys), items = [], dels = [], undo = [];
  const rule = {
    archive: m => m.folder === 'inbox' ? 'archive' : null,
    trash: m => m.folder !== 'trash' ? 'trash' : null,
    spam: m => m.folder !== 'spam' ? 'spam' : null,
    restore: m => (m.folder === 'trash' || m.folder === 'spam') ? (m.from.uid === uid && m.folder === 'trash' ? 'sent' : 'inbox') : null

    if (m.folder === 'drafts') continue;

    toast(msg, undo.length ? { action: 'Undo', ms: 6000, onAction: () => patchMails(undo).catch(e => toast(e.message, { error: true })) } : {});
  } catch (e) { toast('Action failed: ' + e.message, { error: true }); }
}

}
function bindCompose(c) {
  const el = c.el, ed = $('.editor', el), subj = $('.c-subject', el), file = $('input[type=file]', el);
  $('.c-head', el).addEventListener('click', e => { if (!e.target.closest('button')) el.classList.toggle('min'); });
  ['to', 'cc', 'bcc'].forEach(f => {
    const field = $(`[data-f=${f}]`, el), inp = $('input', field);
    field.addEventListener('click', e => {
      const rm = e.target.closest('[data-rm]'); if (rm) { c[f].splice(+rm.dataset.rm, 1); renderChips(c, f); scheduleSave(c); } else if (e.target === field) inp.focus();
    });
    inp.addEventListener('keydown', e => {
      if (['Enter', ',', ';', ' ', 'Tab'].includes(e.key) && inp.value.trim()) { if (e.key !== 'Tab') e.preventDefault(); commitChip(c, f); }
      else if (e.key === 'Backspace' && !inp.value && c[f].length) { c[f].pop(); renderChips(c, f); }
    });
    inp.addEventListener('change', () => commitChip(c, f));
    inp.addEventListener('blur', () => commitChip(c, f));
  });
  ed.addEventListener('input', () => scheduleSave(c)); subj.addEventListener('input', () => scheduleSave(c));
  el.addEventListener('mousedown', e => { if (e.target.closest('[data-fmt]')) e.preventDefault(); });
  el.addEventListener('click', async e => {
    const fm = e.target.closest('[data-fmt]');
    if (fm) {
      const k = fm.dataset.fmt; ed.focus();
      if (k === 'quote') document.execCommand('formatBlock', false, 'blockquote');
      else if (k === 'link') {
        const sel = getSelection(), range = sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
        const url = await askText('Insert link', { placeholder: 'https://example.com', ok: 'Add' });
        if (url && /^(https?:\/\/|mailto:)/i.test(url)) { ed.focus(); if (range) { sel.removeAllRanges(); sel.addRange(range); } document.execCommand('createLink', false, url); }
        else if (url) toast('Links must start with http://, https:// or mailto:', { error: true });
      } else document.execCommand(k, false, null);
      scheduleSave(c); return;
    }
    const b = e.target.closest('[data-c]'); if (b) {
      const a = b.dataset.c;
      if (a === 'min') el.classList.toggle('min');
      else if (a === 'max') { el.classList.remove('min'); el.classList.toggle('max'); }
      else if (a === 'close') closeCompose(c, { save: true });
      else if (a === 'discard') discardCompose(c);
      else if (a === 'ccbcc') { $('[data-r=cc]', el).hidden = false; $('[data-r=bcc]', el).hidden = false; b.hidden = true; $('[data-f=cc] input', el).focus(); }
      else if (a === 'attach') file.click();
      else if (a === 'send') sendCompose(c);
      return;
    }
    const ra = e.target.closest('[data-rmatt]'); if (ra) { c.attachments.splice(+ra.dataset.rmatt, 1); renderAtts(c); scheduleSave(c); }
  });
  file.addEventListener('change', async () => {
    const files = [...file.files]; file.value = '';
    if (!GAS_ON) { toast('Attachments need the Apps Script backend. Set GAS_URL first.', { error: true }); return; }
    for (const f of files) {
      if (f.size > MAX_ATTACH) { toast(`${f.name} is larger than ${fmtSize(MAX_ATTACH)}.`, { error: true }); continue; }
      if (c.attachments.length + c.uploading >= 10) { toast('Maximum 10 attachments.', { error: true }); break; }
      c.uploading++; renderAtts(c);
      try {
        const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
        const r = await gas({ action: 'upload', name: f.name, mimeType: f.type || 'application/octet-stream', data });
        c.attachments.push(r.file);
      } catch (x) { toast(`Upload failed: ${x.message}`, { error: true }); }
      c.uploading--; renderAtts(c); scheduleSave(c);
    }
  });
}
function composeData(c) {
  ['to', 'cc', 'bcc'].forEach(f => { if ($(`[data-f=${f}] input`, c.el).value.trim()) commitChip(c, f); });
  const html = sanitize($('.editor', c.el).innerHTML);
  return { draftId: c.draftId, saved: c.saved, to: [...c.to], cc: [...c.cc], bcc: [...c.bcc], subject: $('.c-subject', c.el).value.trim(), html, attachments: [...c.attachments], threadId: c.threadId };
}
const isBlank = d => !d.to.length && !d.cc.length && !d.bcc.length && !d.subject && !d.attachments.length && !textOf(d.html).replace(/^--/, '').trim();
function scheduleSave(c) { clearTimeout(c.timer); c.timer = setTimeout(() => saveDraft(c), 1500); }
async function saveDraft(c) {
  if (!state.composes.has(c.cid)) return;
  const d = composeData(c); if (isBlank(d)) return;
  await writeDraft(d); c.saved = true;
  const s = $('[data-s]', c.el); if (s) { s.textContent = 'Draft saved'; setTimeout(() => { if (s) s.textContent = ''; }, 2000); }
}
async function writeDraft(d) {
  const ref = doc(db, 'users', me(), 'mails', d.draftId), snippet = textOf(d.html).slice(0, 140);
  const content = { to: d.to, cc: d.cc, bcc: d.bcc, subject: d.subject, body: d.html, snippet, threadId: d.threadId || d.draftId, attachments: d.attachments, ts: serverTimestamp() };
  try {
    if (d.saved) await updateDoc(ref, content);
    else await setDoc(ref, { ...content, from: { uid: me(), name: state.profile.displayName, address: state.profile.address }, folder: 'drafts', read: true, starred: false, labels: [] });
  } catch (e) { console.error(e); toast('Could not save draft: ' + e.message, { error: true }); }
}
async function closeCompose(c, { save = false } = {}) {
  clearTimeout(c.timer);
  if (save) { const d = composeData(c); if (!isBlank(d)) { await writeDraft(d); toast('Draft saved.'); } }
  c.el.remove(); state.composes.delete(c.cid);
}
async function discardCompose(c) {
  clearTimeout(c.timer);
  const d = composeData(c);
  if (!isBlank(d) && !await confirmBox('Discard draft?', 'This message will be deleted.', 'Discard')) return;
  c.el.remove(); state.composes.delete(c.cid);
  if (c.saved) deleteDoc(doc(db, 'users', me(), 'mails', c.draftId)).catch(() => { });
}
function openDraft(m) {
  const existing = [...state.composes.values()].find(c => c.draftId === m.id); if (existing) { existing.el.classList.remove('min'); return; }
  openCompose({ draftId: m.id, saved: true, to: m.to, cc: m.cc, bcc: m.bcc, subject: m.subject === '(no subject)' ? '' : m.subject, html: m.body, attachments: m.attachments, threadId: m.threadId === m.id ? null : m.threadId, title: 'Draft' });
}

function sendCompose(c) {
  const d = composeData(c);
  if (c.uploading) { toast('Wait for attachments to finish uploading.'); return; }
  const all = uniq([...d.to, ...d.cc, ...d.bcc]);
  if (!all.length) { toast('Add at least one recipient.', { error: true }); return; }
  if (all.length > MAX_RECIPIENTS) { toast(`Maximum ${MAX_RECIPIENTS} recipients per message.`, { error: true }); return; }
  if (all.some(a => !isInternal(a)) && !GAS_ON) { toast('Sending to external addresses needs the Apps Script backend.', { error: true }); return; }
  const go = () => { closeCompose(c); queueSend(d); };
  if (!d.subject) confirmBox('Send without subject?', 'This message has no subject line.', 'Send anyway').then(ok => ok && go()); else go();
}
function queueSend(d) {
  let cancelled = false;
  const t = setTimeout(async () => {
    if (cancelled) return;
    try { await deliver(d); toast('Message sent.'); }
    catch (err) { console.error(err); toast(err.message || 'Message could not be sent.', { error: true, ms: 8000 }); openCompose({ ...d, title: 'Not sent' }); }
  }, 5000);
  toast('Sending…', { ms: 5000, action: 'Undo', onAction: () => { cancelled = true; clearTimeout(t); openCompose(d); } });
}
async function deliver(d) {
  const uid = me(), p = state.profile;
  const all = uniq([...d.to, ...d.cc, ...d.bcc]), internal = all.filter(isInternal), external = all.filter(a => !isInternal(a));
  const targets = new Map(), missing = [];
  await Promise.all(internal.map(async a => {
    const s = await getDoc(doc(db, 'usernames', a.split('@')[0]));
    if (s.exists()) targets.set(a, s.data().uid); else missing.push(a);
  }));
  if (missing.length) throw new Error('Address not found: ' + missing.join(', '));
  const msgId = doc(collection(db, 'users', uid, 'mails')).id;
  const threadId = d.threadId || msgId;
  const base = {
    from: { uid, name: p.displayName, address: p.address }, to: d.to, cc: d.cc, subject: d.subject || '(no subject)', body: d.html,
    snippet: textOf(d.html).slice(0, 140), threadId, labels: [], attachments: d.attachments, starred: false, ts: serverTimestamp()
  };
  const batch = writeBatch(db), sentRef = doc(db, 'users', uid, 'mails', msgId);
  batch.set(sentRef, { ...base, bcc: d.bcc, folder: 'sent', read: true, ...(external.length ? { external, extStatus: 'pending' } : {}) });
  const done = new Set();
  for (const [, tuid] of targets) {
    if (done.has(tuid)) continue; done.add(tuid);
    batch.set(doc(db, 'users', tuid, 'mails', tuid === uid ? msgId + '_in' : msgId), { ...base, folder: 'inbox', read: false });
  }
  batch.delete(doc(db, 'users', uid, 'mails', d.draftId));
  await batch.commit();
  if (external.length) {
    try {
      await gas({ action: 'send', to: d.to.filter(a => !isInternal(a)), cc: d.cc.filter(a => !isInternal(a)), bcc: d.bcc.filter(a => !isInternal(a)), subject: d.subject || '(no subject)', html: d.html, attachments: d.attachments.map(a => a.id).filter(Boolean), fromName: p.displayName, fromAddress: p.address });
      await updateDoc(sentRef, { extStatus: 'sent' });
    } catch (x) {
      await updateDoc(sentRef, { extStatus: 'failed' }).catch(() => { });
      toast('Delivered inside Pro Mail, but external delivery failed: ' + x.message, { error: true, ms: 9000 });
    }
  }
}

/* reply / forward */
function quoteBlock(m) {
  return `<div><br></div>${sigHtml()}<div><br></div><div>On ${esc(fmtFull(m.t))}, ${esc(m.from.name || m.from.address)} &lt;${esc(m.from.address)}&gt; wrote:</div><blockquote>${sanitize(m.body)}</blockquote>`;
}
const reSubj = (s, p) => new RegExp('^' + p + ':', 'i').test(s || '') ? s : `${p}: ${s || ''}`;
function replyTo(m, all) {
  const self = state.profile.address;
  const to = m.from.uid === me() ? [...m.to] : [m.from.address];
  const cc = all ? uniq([...m.to, ...m.cc]).filter(a => a !== self && !to.includes(a)) : [];
  openCompose({ to: uniq(to), cc, subject: reSubj(m.subject, 'Re'), html: quoteBlock(m), threadId: m.threadId, title: 'Reply' });
}
function forwardMail(m) {
  const head = `<div><br></div>${sigHtml()}<div><br></div><div>---------- Forwarded message ----------<br>From: ${esc(m.from.name)} &lt;${esc(m.from.address)}&gt;<br>Date: ${esc(fmtFull(m.t))}<br>Subject: ${esc(m.subject)}<br>To: ${esc(m.to.join(', '))}</div><br>${sanitize(m.body)}`;
  openCompose({ subject: reSubj(m.subject, 'Fwd'), html: head, attachments: m.attachments, title: 'Forward' });
}

/* ------------------------------ events ------------------------------ */
const ACT = {
  menu() { if (innerWidth <= 860) document.body.classList.toggle('sb-open'); else document.body.classList.toggle('sb-collapsed'); },
  compose() { openCompose(); },
  nav(el) { state.view = el.dataset.view; state.query = ''; $('#search').value = ''; $('#clearSearch').hidden = true; state.openKey = null; state.selected.clear(); state.cursor = -1; document.body.classList.remove('sb-open'); renderAll(); },
  open(el) { openThread(el.dataset.id); },
  back() { state.openKey = null; renderMain(); },
  sel(el) { const k = el.dataset.id; state.selected.has(k) ? state.selected.delete(k) : state.selected.add(k); renderMain(); },
  selall() { const th = state.threads; if (th.length && th.every(t => state.selected.has(t.key))) state.selected.clear(); else th.forEach(t => state.selected.add(t.key)); renderMain(); },
  star(el) { const m = state.mails.find(x => x.id === el.dataset.id); if (m) patchMails([{ id: m.id, patch: { starred: !m.starred } }]).catch(e => toast(e.message, { error: true })); },
  tstar(el) { toggleThreadStar(el.dataset.id); },
  archive() { moveAction('archive'); }, trash() { moveAction('trash'); }, spam() { moveAction('spam'); }, restore() { moveAction('restore'); },
  markread() { readAction(true); }, markunread() { readAction(false); },
  deleteforever() { deleteForever(); }, emptyfolder() { emptyFolder(); },
  labelmenu(el) { labelMenu(el); },
  refresh() { startMails(); toast('Refreshed.', { ms: 1500 }); },
  more() { state.limit += PAGE; startMails(); },
  togglemsg(el) { const id = el.dataset.id; state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id); const ms = threadMails(state.openKey); if (id === ms[ms.length - 1].id) return; renderMain(); },
  reply(el) { const m = state.mails.find(x => x.id === el.dataset.id); m && replyTo(m, false); },
  replyall(el) { const m = state.mails.find(x => x.id === el.dataset.id); m && replyTo(m, true); },
  forward(el) { const m = state.mails.find(x => x.id === el.dataset.id); m && forwardMail(m); },
  async newlabel() {
    const name = await askText('New label', { placeholder: 'Label name', ok: 'Create' }); if (!name) return;
    const labels = state.profile.labels || [];
    if (labels.length >= 50) return toast('Label limit reached.', { error: true });
    if (labels.some(l => l.name.toLowerCase() === name.toLowerCase())) return toast('That label already exists.', { error: true });
    await saveLabels([...labels, { id: 'l' + Date.now().toString(36), name: name.slice(0, 40), color: PALETTE[labels.length % PALETTE.length] }]).catch(e => toast(e.message, { error: true }));
  },
  async dellabel(el, e) {
    e.stopPropagation(); const id = el.dataset.id, l = (state.profile.labels || []).find(x => x.id === id); if (!l) return;
    if (!await confirmBox('Delete label?', `"${l.name}" will be removed. Messages are not deleted.`, 'Delete')) return;
    if (state.view === 'label:' + id) state.view = 'inbox';
    await saveLabels((state.profile.labels || []).filter(x => x.id !== id)).catch(err => toast(err.message, { error: true }));
  },
  settings() { openSettings(); },
  async theme() { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; renderChrome(); updateDoc(doc(db, 'users', me()), { theme: t }).catch(() => { }); },
  clearsearch() { $('#search').value = ''; state.query = ''; $('#clearSearch').hidden = true; renderAll(); },
  usermenu(el) {
    popover(el, [{ head: state.profile.displayName + ' · ' + state.profile.address }, { label: 'Settings', icon: 'sliders', fn: openSettings }, { sep: true }, { label: 'Sign out', icon: 'logout', fn: () => signOut(auth) }]);
  }
};
function bindGlobal() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el || !ACT[el.dataset.act]) return;
    if (el.dataset.act !== 'dellabel' && e.target.closest('[data-act="dellabel"]')) return;
    ACT[el.dataset.act](el, e);
  });
  let st; $('#search').addEventListener('input', e => {
    clearTimeout(st); st = setTimeout(() => { state.query = e.target.value; state.openKey = null; state.selected.clear(); state.cursor = -1; $('#clearSearch').hidden = !state.query; renderAll(); }, 150);
  });
  document.addEventListener('keydown', e => {
    if (!state.user || e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable) { if (e.key === 'Escape' && t.id === 'search') t.blur(); return; }
    if ($('#overlay').children.length) return;
    const th = state.threads;
    const cur = () => th[state.cursor];
    switch (e.key) {
      case 'c': e.preventDefault(); openCompose(); break;
      case '/': e.preventDefault(); $('#search').focus(); break;
      case 'j': if (!state.openKey && th.length) { state.cursor = Math.min(th.length - 1, state.cursor + 1); renderMain(); document.querySelector('.row.cur')?.scrollIntoView({ block: 'nearest' }); } break;
      case 'k': if (!state.openKey && th.length) { state.cursor = Math.max(0, state.cursor - 1); renderMain(); document.querySelector('.row.cur')?.scrollIntoView({ block: 'nearest' }); } break;
      case 'Enter': case 'o': if (!state.openKey && cur()) openThread(cur().key); break;
      case 'u': case 'Escape': if (state.openKey) { state.openKey = null; renderMain(); } break;
      case 'x': if (!state.openKey && cur()) { ACT.sel({ dataset: { id: cur().key } }); } break;
      case 'e': if (state.openKey || state.selected.size || cur()) { if (!state.openKey && !state.selected.size) state.selected.add(cur().key); moveAction('archive'); } break;
      case '#': if (state.openKey || state.selected.size || cur()) { if (!state.openKey && !state.selected.size) state.selected.add(cur().key); moveAction('trash'); } break;
      case '!': if (state.openKey || state.selected.size || cur()) { if (!state.openKey && !state.selected.size) state.selected.add(cur().key); moveAction('spam'); } break;
      case 's': { const k = state.openKey || (cur() && cur().key); if (k) toggleThreadStar(k); break; }
      case 'r': case 'a': case 'f': {
        if (!state.openKey) break; const ms = threadMails(state.openKey), m = ms[ms.length - 1]; if (!m) break;
        e.preventDefault(); e.key === 'f' ? forwardMail(m) : replyTo(m, e.key === 'a'); break;
      }
    }
  });
  window.addEventListener('beforeunload', e => { if ([...state.composes.values()].some(c => c.uploading)) { e.preventDefault(); e.returnValue = ''; } });
}

/* -------------------------------- boot -------------------------------- */
wireAuth();
if (!CFG_OK) { $('#auth').hidden = false; }
else {
  onAuthStateChanged(auth, async user => {
    if (state.signingUp) return;
    if (user) { if (!state.user || state.user.uid !== user.uid) await boot(user); }
    else {
      state.unsubMails && state.unsubMails(); state.unsubProfile && state.unsubProfile();
      state.user = null; state.profile = null; state.mails = []; state.openKey = null; state.selected.clear(); state.loaded = false;
      state.composes.forEach(c => c.el.remove()); state.composes.clear();
      $('#app').hidden = true; $('#auth').hidden = false; $('#aPass').value = ''; document.documentElement.dataset.theme = 'light';
    }
  });
}
</script>
